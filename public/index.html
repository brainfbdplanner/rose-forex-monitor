<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rose Forex Monitor</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #080810;
      color: #e0e0e0;
      font-family: 'Courier New', monospace;
      min-height: 100vh;
      padding: 14px;
    }

    header {
      text-align: center;
      padding: 18px 0 10px;
      border-bottom: 1px solid #1a1a2e;
      margin-bottom: 16px;
    }

    header h1 { font-size: 1rem; color: #7eb8f7; letter-spacing: 2px; text-transform: uppercase; }
    header p  { font-size: 0.65rem; color: #444; margin-top: 4px; }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 480px;
      margin: 0 auto 14px;
    }

    .market-badge {
      display: inline-block;
      padding: 3px 12px;
      border-radius: 20px;
      font-size: 0.65rem;
      font-weight: bold;
      letter-spacing: 1px;
    }
    .market-badge.open   { background: #0a1f0a; color: #4ade80; border: 1px solid #4ade80; }
    .market-badge.closed { background: #1f0a0a; color: #f87171; border: 1px solid #f87171; }

    .last-scan { font-size: 0.6rem; color: #333; }

    .warning {
      max-width: 480px;
      margin: 0 auto 14px;
      background: #0f0f00;
      border: 1px solid #f0c04033;
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 0.58rem;
      color: #f0c040;
      text-align: center;
      line-height: 1.5;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      max-width: 480px;
      margin: 0 auto;
    }

    .card {
      background: #0d0d1a;
      border: 1px solid #1a1a2e;
      border-radius: 8px;
      overflow: hidden;
    }
    .card.buy  { border-color: #4ade80; }
    .card.sell { border-color: #f87171; }
    .card.offline { border-color: #444; }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 9px 13px;
      background: #0a0a14;
      border-bottom: 1px solid #1a1a2e;
    }

    .pair-name { font-size: 0.9rem; font-weight: bold; color: #7eb8f7; }

    .badge {
      font-size: 0.65rem;
      font-weight: bold;
      padding: 3px 9px;
      border-radius: 4px;
      letter-spacing: 1px;
    }
    .badge.BUY     { background: #041504; color: #4ade80; border: 1px solid #4ade80; }
    .badge.SELL    { background: #150404; color: #f87171; border: 1px solid #f87171; }
    .badge.WAIT    { background: #111; color: #666; border: 1px solid #222; }
    .badge.OFFLINE { background: #111; color: #444; border: 1px solid #222; }

    .price-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 9px 13px;
      border-bottom: 1px solid #1a1a2e;
    }
    .price { font-size: 1.2rem; font-weight: bold; color: #fff; }
    .score { font-size: 0.65rem; color: #666; }
    .score span { color: #f0c040; font-weight: bold; }

    .levels {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 6px;
      padding: 9px 13px;
      border-bottom: 1px solid #1a1a2e;
    }
    .lv label { display: block; font-size: 0.5rem; color: #444; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 2px; }
    .lv .v    { font-size: 0.75rem; font-weight: bold; }
    .lv.entry .v { color: #fff; }
    .lv.sl    .v { color: #f87171; }
    .lv.tp    .v { color: #4ade80; }

    .tfs {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 4px;
      padding: 8px 13px;
      border-bottom: 1px solid #1a1a2e;
    }
    .tf { text-align: center; }
    .tf label { display: block; font-size: 0.5rem; color: #444; text-transform: uppercase; margin-bottom: 2px; }
    .tf .tv   { font-size: 0.6rem; font-weight: bold; padding: 2px 3px; border-radius: 3px; }
    .tv.BULLISH { color: #4ade80; background: #041504; }
    .tv.BEARISH { color: #f87171; background: #150404; }
    .tv.NEUTRAL { color: #888; background: #111; }
    .tv.UNKNOWN { color: #444; background: #0a0a0a; }

    .smc {
      padding: 7px 13px;
      font-size: 0.6rem;
      color: #555;
      border-bottom: 1px solid #1a1a2e;
    }
    .smc span { color: #999; }

    .msg {
      padding: 7px 13px;
      font-size: 0.58rem;
      color: #444;
    }

    .alerts-row {
      text-align: center;
      margin: 14px auto;
      max-width: 480px;
    }

    .toggle {
      background: #0d0d1a;
      border: 1px solid #333;
      color: #666;
      padding: 7px 18px;
      border-radius: 4px;
      font-family: 'Courier New', monospace;
      font-size: 0.65rem;
      cursor: pointer;
      letter-spacing: 1px;
    }
    .toggle.on  { border-color: #4ade80; color: #4ade80; }
    .toggle.off { border-color: #f87171; color: #f87171; }

    .null { color: #222; }
  </style>
</head>
<body>

<header>
  <h1>🎯 Rose Forex Monitor</h1>
  <p>EUR/USD · GBP/USD · USD/JPY — 12H + 1H + 5M</p>
</header>

<div class="top-bar">
  <span class="market-badge" id="marketBadge">LOADING</span>
  <span class="last-scan" id="lastScan">—</span>
</div>

<div class="warning">
  ⚠️ ALERTS ARE FOR REFERENCE ONLY<br>
  Always check your full 9-criteria checklist on TradingView before entering any trade.
</div>

<div class="grid" id="grid">
  <div class="card"><div class="card-top"><span class="pair-name">Loading...</span></div></div>
</div>

<div class="alerts-row">
  <button class="toggle" id="alertBtn" onclick="toggleAlerts()">Loading...</button>
</div>

<script>
  let alertsOn = true;

  const PAIR_META = {
    "EUR/USD": { flag: "🇪🇺", label: "EUR / USD" },
    "GBP/USD": { flag: "🇬🇧", label: "GBP / USD" },
    "USD/JPY": { flag: "🇯🇵", label: "USD / JPY" }
  };

  function nil(v) {
    return v === null || v === undefined
      ? '<span class="null">—</span>'
      : v;
  }

  function tvClass(t) {
    if (!t || t === "UNKNOWN" || t.includes("CLOSED")) return "UNKNOWN";
    return t;
  }

  function renderCard(pair) {
    const meta   = PAIR_META[pair.symbol] || { flag: "📊", label: pair.symbol };
    const status = pair.status || "WAIT";
    const cls    = status === "BUY" ? "buy" : status === "SELL" ? "sell" : status === "OFFLINE" ? "offline" : "";

    return `
    <div class="card ${cls}">
      <div class="card-top">
        <span class="pair-name">${meta.flag} ${meta.label}</span>
        <span class="badge ${status}">${status}</span>
      </div>
      <div class="price-row">
        <span class="price">${nil(pair.price)}</span>
        <span class="score">Score: <span>${pair.score ?? 0}/5</span></span>
      </div>
      <div class="levels">
        <div class="lv entry">
          <label>Entry</label>
          <div class="v">${nil(pair.entry)}</div>
        </div>
        <div class="lv sl">
          <label>Stop Loss</label>
          <div class="v">${nil(pair.stopLoss)}</div>
        </div>
        <div class="lv tp">
          <label>Take Profit</label>
          <div class="v">${nil(pair.takeProfit)}</div>
        </div>
      </div>
      <div class="tfs">
        <div class="tf">
          <label>12H Bias</label>
          <div class="tv ${tvClass(pair.timeframes?.h12?.trend)}">${pair.timeframes?.h12?.trend ?? "—"}</div>
        </div>
        <div class="tf">
          <label>1H Trend</label>
          <div class="tv ${tvClass(pair.timeframes?.h1?.trend)}">${pair.timeframes?.h1?.trend ?? "—"}</div>
        </div>
        <div class="tf">
          <label>5M Entry</label>
          <div class="tv ${tvClass(pair.timeframes?.m5?.trend)}">${pair.timeframes?.m5?.trend ?? "—"}</div>
        </div>
      </div>
      <div class="smc">
        BOS: <span>${pair.analysis?.bos ?? "—"}</span> &nbsp;|&nbsp;
        CHoCH: <span>${pair.analysis?.choch ?? "—"}</span> &nbsp;|&nbsp;
        Liq: <span>${pair.analysis?.liquidity ?? "—"}</span>
      </div>
      <div class="smc">
        RSI: <span>${pair.timeframes?.m5?.rsi ?? "—"}</span> &nbsp;|&nbsp;
        Location: <span>${pair.analysis?.location ?? "—"}</span>
      </div>
      <div class="msg">${pair.message ?? "Waiting..."}</div>
    </div>`;
  }

  async function fetchStatus() {
    try {
      const res  = await fetch("/api/status");
      const data = await res.json();

      const badge = document.getElementById("marketBadge");
      badge.textContent = data.marketStatus;
      badge.className   = "market-badge " + (data.marketOpen ? "open" : "closed");

      if (data.lastScan) {
        document.getElementById("lastScan").textContent =
          "Last scan: " + new Date(data.lastScan).toLocaleTimeString();
      }

      const pairKeys = Object.keys(data.pairs || {});
      if (pairKeys.length) {
        document.getElementById("grid").innerHTML =
          pairKeys.map(k => renderCard(data.pairs[k])).join("");
      }

      alertsOn = data.alerts;
      updateBtn();

    } catch (e) {
      console.error(e);
    }
  }

  function updateBtn() {
    const btn = document.getElementById("alertBtn");
    btn.textContent = alertsOn ? "🔔 TELEGRAM ALERTS: ON" : "🔕 TELEGRAM ALERTS: OFF";
    btn.className   = "toggle " + (alertsOn ? "on" : "off");
  }

  async function toggleAlerts() {
    try {
      const res  = await fetch("/api/alerts", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ enabled: !alertsOn })
      });
      const data = await res.json();
      alertsOn = data.enabled;
      updateBtn();
    } catch (e) { console.error(e); }
  }

  fetchStatus();
  setInterval(fetchStatus, 30000);
</script>
</body>
</html>
